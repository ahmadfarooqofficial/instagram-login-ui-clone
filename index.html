        @font-face {
            font-family: 'Instagram Sans Headline';
            src: url('https://static.cdninstagram.com/rsrc.php/v3/y7/r/9w_v0167-yE.woff2') format('woff2');

            font-style: normal;
            font-display: swap;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent; /* Removes the ugly blue tap box on mobile */
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* FLAT TRANSITIONLESS SPLASH OVERLAY */
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* Hard cut display toggle (No animations) */
        .splash-overlay.hidden {
            display: none; 
        }

        .splash-logo {
            width: 63px;
            height: 63px;
            margin-top: calc(50vh - 70px);
            margin-bottom: auto;
        }

        .splash-footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        /* User Provided PNG for Splash Screen */
        .splash-combined-logo {
            height: 33px;
            width: auto;
            object-fit: contain;
        }

        /* MAIN CONTENT CORE MODULES */
        .page-container {
            display: none;
            flex: 1;
            width: 100%;
        }

        .page-container.loaded {
            display: flex;
        }

        /* Left Split Presentation Side Column */
        .left-section {
            flex: 1.1;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 40px 0 40px;
            text-align: center;
        }

        .left-content {
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ig-gradient-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 26px;
        }

        .headline {
            font-family: 'Instagram Sans Headline', -apple-system, sans-serif;
            font-size: 32px;
            font-weight: 300; 
            line-height: 1.25;
            letter-spacing: -0.2px;
            margin-bottom: 35px; 
            color: #FFFFFF;
        }

        .gradient-text {
            font-family: 'Instagram Sans Headline', -apple-system, sans-serif;
            font-weight: 300;
            background: linear-gradient(90deg, #ff7a00 0%, #ff0169 50%, #d300c5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .hero-showcase-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -15px;
        }

        .hero-showcase {
            width: 530px;
            height: 450px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
        }

        /* Right Side: Identity Access Form Box System */
        .right-section {
            flex: 0.9;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        .auth-wrapper {
            max-width: 368px;
            width: 100%;
            margin: auto;
        }

        .mobile-header-logo {
            display: none;
            justify-content: center;
            margin-bottom: 36px;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #F5F5F5;
        }

        /* Dynamic Floating Input Controls Layout */
        .input-group {
            position: relative;
            margin-bottom: 12px;
            width: 100%;
            height: 50px;
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            transition: border-color 0.2s ease;
        }

        .input-group.focused {
            border-color: #545456;
        }

  /* 1. Flawless exact padding (24px top + 20px line-height + 6px bottom = exactly 50px) */
        .input-group input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 24px 16px 6px 16px; 
            color: #FFFFFF;
            font-size: 14px;
            line-height: 20px; /* Locks the cursor height perfectly */
        }

        /* 2. Default Label (Perfectly centered vertically at rest) */
        .input-group label {
            position: absolute;
            left: 16px;
            top: 15px; /* Centers it perfectly */
            color: #8e8e93;
            font-size: 14px;
            pointer-events: none;
            margin: 0;
            /* Animates position and size cleanly without transform overlaps */
            transition: top 0.15s ease-out, font-size 0.15s ease-out, color 0.15s ease-out; 
        }

        /* 3. Floating Label (Snugs to the top, shrinks cleanly, zero overlap) */
        .input-group.floating label {
            top: 6px; /* Sits cleanly at the top edge */
            font-size: 11px; /* Native size reduction instead of scale() */
            color: #a8a8a8;
        }

        /* Button Action Layout Core Settings */
      .btn, .forgot-link {
            width: 100%;
            height: 44px;
            border-radius: 22px; 
            font-size: 14px;
            font-weight: 600;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
        }

        /* 3. Add tactile click feedback (shrinks slightly when tapped) */
        .btn:active, .forgot-link:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .btn-primary {
            background-color: #00376b; 
            color: #8e8e93;
            margin-top: 12px;
            pointer-events: none;
            cursor: default;
        }

        .btn-primary.active {
            background-color: #0095f6;
            color: #FFFFFF;
            pointer-events: auto;
            cursor: pointer;
        }

        .btn-primary.active:hover {
            opacity: 0.95;
        }

        .forgot-link {
            background-color: transparent;
            color: #FFFFFF;
            margin: 16px 0 24px 0;
            cursor: pointer;
        }

        .forgot-link:hover {
            background-color: rgba(255, 255, 255, 0.08); 
        }

        .btn-secondary-outline {
            background: transparent;
            border: 1px solid #3a3a3c;
            color: #FFFFFF;
            margin-bottom: 12px;
        }

        .btn-secondary-outline:hover {
            background-color: rgba(255, 255, 255, 0.08); 
        }

        .btn-secondary-outline svg {
            fill: #1877F2;
            width: 16px;
            height: 16px;
        }

        .btn-link-outline {
            background: transparent;
            border: 1px solid #0095f6;
            color: #0095f6;
        }

        .btn-link-outline:hover {
            background-color: rgba(0, 149, 246, 0.06);
        }

}

    letter-spacing: -0.3px;

        /* Document Structural Base Footer layout parameters */
        footer {
            background-color: #000000;
            padding: 32px 16px;
            border-top: 1px solid #1c1c1e;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 18px;
            max-width: 1000px;
            margin: 0 auto 16px auto;
        }

        .footer-links a {
            color: #8e8e93;
            text-decoration: none;
            font-size: 12px;
        }

        .footer-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            color: #8e8e93;
            font-size: 12px;
        }

        .lang-select {
            background: transparent;
            border: none;
            color: #8e8e93;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        @media (max-width: 950px) {
            .left-section {
                display: none;
            }
            .right-section {
                flex: 1;
                padding: 40px 24px;
            }
            .mobile-header-logo {
                display: flex;
            }
        }

        /* TOP LOADING PROGRESS BAR */
        .ig-top-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            background: linear-gradient(to right, #f8d348, #f09433, #dc2743, #cc2366, #bc1888);
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

      .ig-top-progress-bar.loading {
            opacity: 1;
            animation: progressSweep 1.2s ease-out forwards;
        }

        @keyframes progressSweep {
            0% { width: 0%; }
            50% { width: 65%; }
            85% { width: 90%; }
            100% { width: 100%; }
        }
    </style>

   <script>
        const heroImages = [
            'assets/img/1.webp',
            'assets/img/2.webp',
            'assets/img/3.webp',
        ];

        window.addEventListener('DOMContentLoaded', () => {
            // Apply background before splash unmounts to ensure it is pre-rendered
            const randomUrl = heroImages[Math.floor(Math.random() * heroImages.length)];
            document.getElementById('randomHero').style.backgroundImage = `url('${randomUrl}')`;

            const splashOverlay = document.getElementById('splashScreen');
            const mainContent = document.getElementById('mainContentContainer');

            setTimeout(() => {
                splashOverlay.classList.add('hidden');
                mainContent.classList.add('loaded');
            }, 3000);
        });

        const textInputs = document.querySelectorAll('.input-group input');

        textInputs.forEach(input => {
            const wrapBox = input.parentElement;

            input.addEventListener('focus', () => {
                wrapBox.classList.add('focused');
                wrapBox.classList.add('floating');
            });

            input.addEventListener('blur', () => {
                wrapBox.classList.remove('focused');
                if (input.value.trim() === "") {
                    wrapBox.classList.remove('floating');
                }
            });

            input.addEventListener('input', () => {
                evaluateFormState();
            });
        });

        const accountField = document.getElementById('accountID');
        const secretField = document.getElementById('accountSecret');
        const loginBtn = document.getElementById('loginActionButton');

        function evaluateFormState() {
            if (accountField.value.trim().length > 0 && secretField.value.length >= 6) {
                loginBtn.classList.add('active');
            } else {
                loginBtn.classList.remove('active');
            }
        }

        // UNIVERSAL LOADING BAR TRIGGER
        function triggerLoadingAnimation(element) {
            const progressBar = document.getElementById('topProgressBar');
            
            // Prevent multiple clicks while loading
            if (element) {
                element.style.pointerEvents = 'none';
            }

            // Reset and trigger CSS animation smoothly
            progressBar.classList.remove('loading');
            void progressBar.offsetWidth; // Force CSS reflow
            progressBar.classList.add('loading');

            // Simulate 1.2s network load, then clean up
            setTimeout(() => {
                progressBar.style.opacity = '0';
                
                setTimeout(() => {
                    progressBar.classList.remove('loading');
                    progressBar.style.opacity = '';
                    if (element) {
                        element.style.pointerEvents = 'auto';
                    }
                }, 300);
            }, 1200); 
        }

        // 1. Attach to the main login form submission
        document.getElementById('authLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            triggerLoadingAnimation(document.getElementById('loginActionButton'));
        });

        
        // 2. Attach to all secondary action buttons and links
        const otherActions = document.querySelectorAll('.btn-secondary-outline, .btn-link-outline, .forgot-link');
        
        otherActions.forEach(action => {
            action.addEventListener('click', (e) => {
                e.preventDefault(); // Stop instant jump
                triggerLoadingAnimation(action);
                
                // Read the URL from the href attribute
                const targetUrl = action.getAttribute('href');
                
                // If a real link exists (not just "#" or empty), redirect after the animation
                if (targetUrl && targetUrl !== '#' && targetUrl !== '') {
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1200); // 1.2s matches the progress bar speed exactly
                }
            });
        });
    </script>
